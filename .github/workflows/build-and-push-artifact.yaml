name: build and push to artifactory

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment'
        required: true
        default: 'UAT'
        type: choice
        options:
          - PROD
          - UAT
          - Development
  push:
    branches:
      - 'release*'

jobs:
  build-artifact-and-push-to-artifactory:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment}}

    steps:
    # Checkout repozitorija sa svim tagovima (potrebno za git describe)
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Određivanje verzije image-a:
    # - Za release* brancheve: koristi posljednji git tag
    # - Za ostale brancheve: koristi kratki commit hash
    - name: Set up Docker Image Version
      run: |
        if [[ "${{ github.ref }}" == refs/heads/release* ]]; then
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "IMAGE_TAG=${LATEST_TAG}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi
        else
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Artifactory
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.ARTIFACTORY_REGISTRY }}
        username: ${{ vars.ARTIFACTORY_USERNAME }}
        password: ${{ secrets.ARTIFACTORY_TOKEN }}

    - name: Build & Push Docker Image with cache
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ vars.PROJECT_PATH }}/Dockerfile
        push: true
        tags: |
          ${{ vars.ARTIFACTORY_REGISTRY }}/${{ vars.ARTIFACTORY_REPOSITORY }}/${{ vars.IMAGE_NAME }}:latest
          ${{ vars.ARTIFACTORY_REGISTRY }}/${{ vars.ARTIFACTORY_REPOSITORY }}/${{ vars.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
