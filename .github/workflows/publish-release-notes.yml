name: Publish version notes from GitHub tags

# Tag a successfully approved UAT deployment as uat-vX.Y.Z.
# Once that exact version is promoted to production, tag it vX.Y.Z.
# UAT notes are generated by GitHub; production reuses those SAME notes.
# No scripts/files need to be maintained to produce notes for the app.
on:
  push:
    tags:
      - "uat-v*"
      - "v*"

permissions:
  contents: write

jobs:
  publish-uat:
    if: startsWith(github.ref_name, 'uat-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate approved UAT version tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^uat-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - name: Publish UAT notes using GitHub's built-in release notes generator
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing UAT release preserved: $TAG"
          else
            gh release create "$TAG" --verify-tag --title "UAT $TAG" --prerelease --generate-notes
          fi

  publish-prod:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate production tag and require matching UAT release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "uat-$TAG" --json body --jq '.body' > "$RUNNER_TEMP/approved-uat-notes.md"
          test -s "$RUNNER_TEMP/approved-uat-notes.md"
      - name: Publish identical notes under the production version tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing PROD release preserved: $TAG"
          else
            gh release create "$TAG" --verify-tag --title "PROD $TAG" \
              --notes-file "$RUNNER_TEMP/approved-uat-notes.md"
          fi
