name: Build and push native application images
on:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [UAT, PROD]
        default: UAT
        required: true
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.TEST_SQL_SA_PASSWORD }}
        ports: ["1433:1433"]
    env:
      RBBH_TEST_SQLSERVER: "Server=localhost,1433;User ID=sa;Password=${{ secrets.TEST_SQL_SA_PASSWORD }};TrustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Require disposable SQL test configuration
        env:
          SQL_PASSWORD: ${{ secrets.TEST_SQL_SA_PASSWORD }}
        run: test -n "$SQL_PASSWORD"
      - run: dotnet restore RelatedPartiesRegister.Migration.slnx --configfile src/Web.Blazor/NuGet.config
      - run: dotnet build RelatedPartiesRegister.Migration.slnx -c Release --no-restore -p:RunAnalyzers=true
      - run: dotnet test RelatedPartiesRegister.Migration.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/ci-tests
      - name: Reject skipped tests
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          files = glob.glob("artifacts/ci-tests/*.trx")
          assert files, "No test results"
          for path in files:
              root = E.parse(path).getroot()
              assert not any(r.get("outcome") == "NotExecuted" for r in root.iter() if r.tag.endswith("UnitTestResult")), path
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dotnet-results, path: artifacts/ci-tests }
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [admin, gost, kapital, PL, limiti, FL]
    env:
      BROWSER_FIXTURE_ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: dotnet restore tests/Web.Blazor.BrowserHost/Web.Blazor.BrowserHost.csproj --configfile src/Web.Blazor/NuGet.config
      - run: dotnet build tests/Web.Blazor.BrowserHost/Web.Blazor.BrowserHost.csproj --no-restore
      - run: npm ci
        working-directory: tests/Web.Blazor.Browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/Web.Blazor.Browser
      - run: npm test -- --workers=1 --retries=0
        working-directory: tests/Web.Blazor.Browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.role }}
          path: artifacts/migration-browser
  image:
    if: github.event_name != 'pull_request'
    needs: [dotnet, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'PROD' }}
    strategy:
      matrix:
        component: [web, api]
    concurrency:
      group: image-${{ github.sha }}-${{ matrix.component }}
      cancel-in-progress: false
    env:
      REGISTRY: ${{ vars.ARTIFACTORY_REGISTRY }}
      REPOSITORY: ${{ vars.ARTIFACTORY_REPOSITORY }}
      WEB_IMAGE: ${{ vars.WEB_IMAGE_NAME }}
      API_IMAGE: ${{ vars.API_IMAGE_NAME }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve distinct native image targets
        id: target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$REPOSITORY" =~ ^[a-z0-9._/-]+$ ]]
          [[ "$WEB_IMAGE" =~ ^[a-z0-9]+([-a-z0-9]*[a-z0-9])?$ ]]
          [[ "$API_IMAGE" =~ ^[a-z0-9]+([-a-z0-9]*[a-z0-9])?$ ]]
          test "$WEB_IMAGE" != "$API_IMAGE"
          if [ "$COMPONENT" = web ]; then
            name="$WEB_IMAGE"; context=src/Web.Blazor; dockerfile=src/Web.Blazor/Dockerfile
          else
            name="$API_IMAGE"; context=.; dockerfile=RelatedPartiesRegister/Dockerfile
          fi
          echo "tag=$REGISTRY/$REPOSITORY/$name:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ARTIFACTORY_REGISTRY }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_TOKEN }}
      - name: Refuse to replace an existing commit tag
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
          REGISTRY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          set -euo pipefail
          image_path="${TAG#"$REGISTRY/"}"
          repository="${image_path%:*}"
          tag="${image_path##*:}"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --head --user "$REGISTRY_USERNAME:$REGISTRY_TOKEN" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://$REGISTRY/v2/$repository/manifests/$tag")
          if [ "$status" != 404 ]; then
            echo "Commit tag must not already exist; manifest check returned $status." >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ steps.target.outputs.context }}
          file: ${{ steps.target.outputs.dockerfile }}
          push: true
          tags: ${{ steps.target.outputs.tag }}
      - name: Record immutable deployment reference
        env:
          TAG: ${{ steps.target.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
