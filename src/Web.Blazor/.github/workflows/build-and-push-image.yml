name: Build and push application image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing registry configuration
        required: true
        default: UAT
        type: choice
        options: [Development, UAT, PROD]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    name: Build and push
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'PROD' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry configuration
        shell: bash
        env:
          ARTIFACTORY_REGISTRY: ${{ vars.ARTIFACTORY_REGISTRY }}
          ARTIFACTORY_REPOSITORY: ${{ vars.ARTIFACTORY_REPOSITORY }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          set -euo pipefail
          for name in ARTIFACTORY_REGISTRY ARTIFACTORY_REPOSITORY IMAGE_NAME ARTIFACTORY_USERNAME ARTIFACTORY_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub environment value: ${name}" >&2
              exit 1
            fi
          done
          if ! [[ "$IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "IMAGE_NAME must be a lowercase container image name." >&2
            exit 1
          fi
      - name: Resolve image tags
        id: image
        shell: bash
        env:
          ARTIFACTORY_REGISTRY: ${{ vars.ARTIFACTORY_REGISTRY }}
          ARTIFACTORY_REPOSITORY: ${{ vars.ARTIFACTORY_REPOSITORY }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          set -euo pipefail
          image="${ARTIFACTORY_REGISTRY}/${ARTIFACTORY_REPOSITORY}/${IMAGE_NAME}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            immutable_tag="${GITHUB_REF_NAME}"
          else
            immutable_tag="sha-${GITHUB_SHA:0:12}"
          fi
          if ! [[ "$immutable_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Resolved image tag is not valid: ${immutable_tag}" >&2
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=${immutable_tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to Artifactory
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ARTIFACTORY_REGISTRY }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_TOKEN }}
      - name: Build and push immutable tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.immutable_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
